<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ConnectHub — Notifications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <!-- Mobile Header -->
  <header class="mobile-header">
    <button type="button" class="mh-btn open-drawer-btn" aria-label="Open menu">
      <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <a href="/index.html" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1"></path><path d="M18 8h4a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-4"></path><circle cx="8" cy="12" r="2"></circle></svg>
      </span>
      <span class="brand-text gradient-text">ConnectHub</span>
    </a>
    <a href="/notifications.html" class="mh-btn" aria-label="Notifications">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span class="mh-badge notif-badge" hidden>0</span>
    </a>
  </header>

  <div class="app-shell">
    <!-- Left Sidebar -->
    <aside class="sidebar-left">
      <div class="sidebar-inner">
        <a href="/index.html" class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1"></path><path d="M18 8h4a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-4"></path><circle cx="8" cy="12" r="2"></circle></svg>
          </span>
          <span class="brand-text gradient-text">ConnectHub</span>
        </a>

        <ul class="nav-list">
          <li>
            <a href="/index.html" class="nav-link" data-page="index">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
              <span class="nav-label">Home</span>
            </a>
          </li>
          <li>
            <a href="/explore.html" class="nav-link" data-page="explore">
              <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>

            </a>
          </li>
          <li>
            <a href="/notifications.html" class="nav-link active" data-page="notifications">
              <svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              <span class="nav-label">Notifications</span>
              <span class="nav-badge notif-badge" hidden>0</span>
            </a>
          </li>
          <li>
            <a href="/messages.html" class="nav-link" data-page="messages">
              <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>

            </a>
          </li>
          <li>
            <a href="/profile.html" class="nav-link" data-page="profile">
              <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span class="nav-label">Profile</span>
            </a>
          </li>
        </ul>

        <button type="button" class="btn btn-primary sidebar-create create-post-trigger">
          <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span class="create-label">Create Post</span>
        </button>

        <div class="sidebar-footer">
          <button type="button" class="theme-toggle-row theme-switch-btn" aria-label="Toggle dark mode">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
            <span class="theme-label">Dark Mode</span>
            <span class="switch"></span>
          </button>

          <div class="user-chip-container"></div>
        </div>
      </div>
    </aside>

    <!-- Center Main Column -->
    <main class="main-column">
      <div class="page-header">
        <div class="page-header-row">
          <h1 class="page-title">Notifications</h1>
          <button type="button" class="btn btn-ghost btn-sm mark-all-read-btn">Mark all read</button>
        </div>
        <div class="tabs">
          <button type="button" class="tab notif-filter-tab active" data-filter="all">All</button>
          <button type="button" class="tab notif-filter-tab" data-filter="unread">Unread</button>
        </div>
      </div>

      <!-- Notifications List -->
      <div class="card notifications-list-container" style="overflow: hidden;"></div>
    </main>

    <!-- Right Sidebar -->
    <aside class="sidebar-right">
      <div class="rightbar-inner">
        <section class="card widget">
          <div class="widget-header">
            <h3 class="widget-title">Who to follow</h3>
            <a href="/explore.html" class="widget-link">See all</a>
          </div>
          <div class="widget-suggestions-list">
            <div class="spinner-center"><div class="spinner"></div></div>
          </div>
        </section>

        <footer class="site-footer">
          <div>ConnectHub &copy; 2026 &middot; Keep in touch</div>
        </footer>
      </div>
    </aside>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/index.html" class="bn-item" data-page="index">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>

    <a href="/explore.html" class="bn-item" data-page="explore">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
      <span>Explore</span>
    </a>
    <button type="button" class="bn-create create-post-trigger" aria-label="Create post">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <a href="/messages.html" class="bn-item" data-page="messages">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      <span>Messages</span>
    </a>
    <a href="/profile.html" class="bn-item" data-page="profile">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Mobile Drawer -->
  <div class="drawer-backdrop">
    <div class="drawer">
      <div class="drawer-head">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1"></path><path d="M18 8h4a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-4"></path><circle cx="8" cy="12" r="2"></circle></svg>
          </span>
          <span class="brand-text gradient-text">ConnectHub</span>
        </div>
        <button type="button" class="icon-btn close-drawer-btn" aria-label="Close menu">
          <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="drawer-user-container"></div>
      <ul class="nav-list">
        <li><a href="/index.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Home</span></a></li>
        <li><a href="/explore.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg><span>Explore</span></a></li>
        <li><a href="/notifications.html" class="nav-link active"><svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg><span>Notifications</span><span class="nav-badge notif-badge" hidden>0</span></a></li>
        <li><a href="/messages.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span>Messages</span></a></li>
        <li><a href="/profile.html" class="nav-link"><svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Profile</span></a></li>
      </ul>
      <div class="drawer-sep"></div>
      <button type="button" class="theme-toggle-row theme-switch-btn"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg><span>Dark Mode</span><span class="switch"></span></button>
      <button type="button" class="nav-link logout-link logout-trigger" style="margin-top:auto;"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg><span>Log Out</span></button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components.js"></script>
